name: Release

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version from Plugin.cs
        id: version
        run: |
          VERSION=$(grep -oP '(?<=Version = ")[^"]+' WordFilterPlus/Plugin.cs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Zip dist folder
        run: |
          cd dist
          zip -r ../WordFilterPlus-${{ steps.version.outputs.version }}.zip Mod_WordFilterPlus

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: WordFilterPlus v${{ steps.version.outputs.version }}
          files: WordFilterPlus-${{ steps.version.outputs.version }}.zip
          make_latest: true
